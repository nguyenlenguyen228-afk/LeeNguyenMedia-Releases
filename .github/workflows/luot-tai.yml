name: Dem luot tai
on:
  schedule:
    - cron: "17 * * * *"   # mỗi giờ
  workflow_dispatch:
  release:
    types: [published, edited]
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cong luot tai
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/dem_luot_tai.py
      - name: Luu ket qua
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luot-tai
          git diff --cached --quiet || (git commit -m "Cập nhật lượt tải" && git push origin HEAD:main)
